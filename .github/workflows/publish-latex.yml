# Builds and publishes main.pdf.
#
# There is deliberately no build in this file. It lives once, in
# Lecture-Notes-Template-2026, as a reusable workflow that this repository and
# its siblings call -- so a fix to the build reaches all of them at their next
# run instead of having to be applied seven times. This file is the caller, and
# it exists only because a reusable workflow cannot declare its own `on:`
# triggers.
#
# To change how the notes are built, change the template, not this file:
# https://github.com/thefundamentaltheor3m/Lecture-Notes-Template-2026/blob/main/.github/workflows/latex-build-deploy.yml
#
# The TeX Live package manifest is shared from there too. If this repository
# ever loads a \usepackage the shared manifest does not cover, prefer adding it
# to the template's .github/texlive-packages.txt over dropping a local copy in
# here -- a local copy overrides the shared one and then has to be maintained
# separately.

name: Build and Deploy LaTeX Project

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'README.md'
      - 'TOPICS.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'README.md'
      - 'TOPICS.md'
  workflow_dispatch:

# A second push to the same branch makes the first build's PDF irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latex:
    uses: thefundamentaltheor3m/Lecture-Notes-Template-2026/.github/workflows/latex-build-deploy.yml@main
    # A called workflow cannot grant itself more than the caller has, so the
    # publishing jobs' `contents: write` and `pull-requests: write` are granted
    # here and narrowed there.
    permissions:
      contents: write
      pull-requests: write
    # Stopgap, 2026-09-23. The template installs TeX Live from
    # ftp.math.utah.edu, which refused or timed out on every attempt that day,
    # and the cached tree had just expired after a week without a build. So
    # every run had to install from scratch, and none could. This points the
    # install at another mirror of the same frozen TeX Live 2025 archive. The
    # cache key does not include the mirror, so nothing else changes. Delete
    # this once the template tries more than one mirror.
    with:
      texlive-repo: 'https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/tlnet-final'
